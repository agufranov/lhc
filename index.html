<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LHC — beam playground</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div class="overlay">
      <header class="title">
        <h1>LHC</h1>
        <!-- The places the camera can be, and the one navigation this toy has. It is *here*
             and not in the console below, because where it used to be it was a row of tabs in
             the same box as the controls of whatever place was selected — so every press
             resized the box and moved every other control in it. A camera selector belongs
             beside the name of the thing, at a size that never changes. On a phone the same
             element is fixed to the very bottom of the window, under the sheet, where a thumb
             is; `ui/controls.ts` builds it and the stylesheet decides which of the two it is. -->
        <nav class="places" id="viewbar" role="tablist"></nav>
        <span class="sub">two beams · filled from the SPS · collided at P3 and P7</span>
        <!-- The machine's own voice: the last thing that happened, loudest first. It is
             inside the title block on purpose — the camera is fitted against the *measured*
             height of that block, so the machine makes room for it by itself. Its height
             never changes, or the picture would resize every time something went wrong. -->
        <div class="ticker" id="ticker"></div>
      </header>

      <!-- The left-hand rail: what the beam is, what it is doing, and what is computing it.
           A column rather than three placed panels, because on a short window they would
           otherwise be laid on top of one another — see `check:page`. -->
      <aside class="rail rail--left" id="rail-left">
        <section class="panel panel--beam" id="panel-beam"></section>
        <section class="panel panel--physics" id="panel-physics"></section>
        <section class="panel panel--compute" id="panel-compute"></section>
      </aside>

      <!-- The right-hand rail: what the run is for, and then the machine readouts. POWER is
           long and a full-height column is the only shape that holds it.

           RUN is at the top of this rail and not in the left one, and that is a measured
           decision rather than a taste: the left rail is already 85 px over a 906 px window
           with BEAM and PHYSICS in it — those are the readouts you operate against, so they
           keep the space they have — and the spectra are what you look at once the machine is
           running itself. See `docs/rendering.md`. -->
      <aside class="rail" id="rail-right">
        <section class="panel panel--run" id="panel-run"></section>
        <section class="panel panel--power" id="panel-power"></section>
        <section class="panel panel--injector" id="panel-injector"></section>
      </aside>

      <!-- The experiments, in the free bands above and below the injector — the one stretch
           of picture with nothing in it. They are placed by `eventCardBoxes` rather than
           flowed, because where they can go is a fact about where the machine is drawn.
           Neither is there until it has recorded something: an empty box reading "no
           collisions" is a box holding picture space against the day it has anything to show,
           and a panel that arrives when the beams start colliding says the same thing by
           arriving. -->
      <section class="panel panel--event" id="panel-ip-a" hidden></section>
      <section class="panel panel--event" id="panel-ip-b" hidden></section>

      <!-- The console: the nameplate of the place you are at, its lamps, its controls, its
           gauges, and the two keys that are never folded away. Its box and every section in
           it is a fixed size, so changing place changes what is *on* the desk and never where
           anything sits — see `ui/controls.ts`. -->
      <footer class="controls deck" id="controls"></footer>

      <!-- The bottom sheet: where the machine readouts go on a window too narrow to stand
           them beside the machine. It holds the *same* panel elements — `ui/sheet.ts` moves
           them in and hands them back — so there is one BEAM readout in this app and one line
           of `hud.ts` writing to it, whatever column it is standing in. Its height is added to
           what the camera keeps clear, so "no panel over the machine" survives a phone. -->
      <div class="sheet" id="sheet" hidden>
        <nav class="sheet-tabs" id="sheet-tabs"></nav>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
