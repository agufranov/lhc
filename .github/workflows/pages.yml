name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same four gates a session runs locally: types, physics, drawing, layout.
      # `check:page` drives the Chrome that comes with the runner image, headless, and starts
      # its own Vite server; it needs no display and downloads no browser.
      - run: npm run typecheck
      - run: npm run check
      - run: npm run check:render
      - run: npm run check:page
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
